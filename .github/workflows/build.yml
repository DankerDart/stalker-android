name: Android CI Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Unpack and Debug Structure
      run: |
        mv "xray-16-android-bundle (1).z01" "xray.z01" 2>/dev/null || true
        mv "xray-16-android-bundle (1).zip" "xray.zip" 2>/dev/null || true
        
        7z x xray.zip -oextracted_project -y
        
        echo "=== ПОЛНЫЙ ПОИСК ВСЕХ ФАЙЛОВ GRADLEW ==="
        find extracted_project -name "*gradlew*"
        
        echo "=== ПЕРВЫЕ ДВА УРОВНЯ ПАПКИ ЭКСТРАКТА ==="
        ls -R extracted_project | head -n 40
