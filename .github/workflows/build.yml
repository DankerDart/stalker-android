name: Android CI Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Combine and Unpack Split ZIP
      run: |
        # Склеиваем многотомный ZIP-архив в один рабочий файл
        # Для этого используем встроенную утилиту zip -s 0
        zip -s 0 "xray-16-android-bundle (1).zip" --out full_project.zip
        
        # Распаковываем получившийся целый архив
        unzip full_project.zip -d extracted_project
        
        # Находим папку, где лежит файл настроек settings.gradle
        SETTINGS_DIR=$(find extracted_project -name "settings.gradle" -exec dirname {} \;)
        echo "PROJECT_ROOT=$SETTINGS_DIR" >> $GITHUB_ENV

    - name: Setup Android NDK
      uses: android-actions/setup-android@v3

    - name: Install NDK Component
      run: |
        sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

    - name: Build Engine APK
      run: |
        cd ${{ env.PROJECT_ROOT }}
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: stalker-xray-apk
        path: |
          ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
