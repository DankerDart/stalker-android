name: Android CI Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "ndk;26.1.10909125" \
            "cmake;3.22.1" \
            "build-tools;34.0.0" \
            "platforms;android-34"

      - name: Configure CMake
        run: |
          cd xray-16
          
          mkdir -p build && cd build
          
          $ANDROID_HOME/cmake/3.22.1/bin/cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_MAKE_PROGRAM=$ANDROID_HOME/cmake/3.22.1/bin/cmake

      - name: Build
        run: |
          cd xray-16/build
          $ANDROID_HOME/cmake/3.22.1/bin/cmake --build . -- -j$(nproc)

      - name: Create APK Structure
        run: |
          cd xray-16
          
          mkdir -p app/src/main/java/com/stalker/xray
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/assets
          mkdir -p app/build/outputs/apk/debug
          
          # Копируем собранные .so библиотеки
          cp build/src/xrEngine/*.so         app/src/main/jniLibs/arm64-v8a/ 2>/dev/null || true
          cp build/src/xrGame/*.so           app/src/main/jniLibs/arm64-v8a/ 2>/dev/null || true
          cp build/src/xrRenderGLES/*.so     app/src/main/jniLibs/arm64-v8a/ 2>/dev/null || true
          
          # Ищем все .so в build/
          find build -name "*.so" -exec cp {} app/src/main/jniLibs/arm64-v8a/ \; 2>/dev/null || true

      - name: Create Android App
        run: |
          cd xray-16
          
          # AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.stalker.xray"
              android:versionCode="1"
              android:versionName="0.1-stub">
              <uses-feature android:glEsVersion="0x00030001" android:required="true" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <application android:label="STALKER XRay" android:hasCode="false">
                  <activity android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          # Java-обёртка
          cat > app/src/main/java/com/stalker/xray/MainActivity.java << 'EOF'
          package com.stalker.xray;
          public class MainActivity extends android.app.Activity {
              static { System.loadLibrary("xrEngine"); }
              public native void nativeMain(String libPath);
              @Override protected void onCreate(android.os.Bundle b) {
                  super.onCreate(b);
                  nativeMain(getApplicationInfo().nativeLibraryDir);
                  finish();
              }
          }
          EOF
          
          # app/build.gradle
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              compileSdk 34
              defaultConfig {
                  minSdk 24
                  targetSdk 34
                  ndk {
                      abiFilters 'arm64-v8a'
                  }
                  externalNativeBuild {
                      cmake {
                          path "../../CMakeLists.txt"
                          version "3.22.1"
                      }
                  }
              }
              sourceSets {
                  main {
                      jniLibs.srcDirs = ['src/main/jniLibs']
                      assets.srcDirs = ['src/main/assets']
                  }
              }
          }
          EOF
          
          # settings.gradle
          cat > settings.gradle << 'EOF'
          include ':app'
          EOF
          
          # root build.gradle
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          
          # gradle.properties
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF
          
          # gradle-wrapper.properties
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Build APK with Gradle
        run: |
          cd xray-16
          ANDROID_HOME=$ANDROID_HOME \
          ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT \
          ./gradlew assembleDebug --no-daemon -q 2>&1 | tail -20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stalker-xray-apk
          path: |
            xray-16/app/build/outputs/apk/debug/*.apk
            xray-16/app/build/outputs/apk/debug/output-metadata.json
          retention-days: 7
