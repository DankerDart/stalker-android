name: Android CI Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Rename and Merge Split ZIP
      run: |
        # Переименовываем файлы под стандарт Linux, чтобы объединить их
        mv "xray-16-android-bundle (1).z01" "xray-16-android-bundle (1).zip.001" 2>/dev/null || true
        mv "xray-16-android-bundle (1).zip" "xray-16-android-bundle (1).zip.002" 2>/dev/null || true
        
        # Склеиваем две половинки в один полноценный ZIP-файл
        cat "xray-16-android-bundle (1).zip.001" "xray-16-android-bundle (1).zip.002" > final_project.zip
        
        # Распаковываем получившийся архив
        unzip final_project.zip -d extracted_project
        
        # Выводим список файлов для проверки в логах (чтобы мы видели, что всё на месте)
        echo "=== Список распакованных файлов ==="
        find extracted_project -maxdepth 3
        
        # Находим папки с проектом
        SETTINGS_DIR=$(find extracted_project -name "settings.gradle" -exec dirname {} \;)
        echo "PROJECT_ROOT=$SETTINGS_DIR" >> $GITHUB_ENV
        
        GRADLEW_PATH=$(find extracted_project -name "gradlew")
        echo "GRADLEW_DIR=$(dirname $GRADLEW_PATH)" >> $GITHUB_ENV

    - name: Setup Android NDK
      uses: android-actions/setup-android@v3

    - name: Install NDK Component
      run: |
        sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

    - name: Build Engine APK
      run: |
        cd ${{ env.GRADLEW_DIR }}
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: stalker-xray-apk
        path: |
          ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
