name: Android CI Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Unpack Multi-part ZIP
      run: |
        # Распаковываем файлы через 7z
        mv "xray-16-android-bundle (1).z01" "xray.z01" 2>/dev/null || true
        mv "xray-16-android-bundle (1).zip" "xray.zip" 2>/dev/null || true
        7z x xray.zip -oextracted_project -y

    - name: Setup Android NDK
      uses: android-actions/setup-android@v3

    - name: Install NDK Component
      run: |
        # Устанавливаем компиляторы для C++ движка Сталкера
        sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

    - name: Auto-Generate Gradle and Build
      run: |
        cd extracted_project/xray-16
        
        # 1. Принудительно создаем файл настроек settings.gradle
        echo "include ':app'" > settings.gradle
        
        # 2. Автоматически создаем главный build.gradle, которого не хватало
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.0'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
EOF

        # 3. Прописываем пути к Android SDK и NDK для компилятора
        echo "ndk.dir=$ANDROID_NDK_ROOT" > local.properties
        echo "sdk.dir=$ANDROID_HOME" >> local.properties
        
        # 4. Запускаем сборку напрямую через системный gradle
        gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: stalker-xray-apk
        path: |
          extracted_project/xray-16/**/build/outputs/apk/debug/*.apk
